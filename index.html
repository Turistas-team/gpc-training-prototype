<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GPC Ladders</title>
<link rel="icon" href="assets/img/logo-gpc-upc.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Rubik:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1E1B3A; --ink2:#45405F; --ink3:#6B6690;
  --sky:#EDE7FB; --sky2:#F7F4FE; --line:#E2DCF2; --line2:#CFC6EA;
  --violet:#8B5CF6; --violet-d:#6D28D9; --blue:#3B8BEB; --teal:#2EC4B6; --orange:#F7931E; --pink:#F05A8C;
}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--sky2);overflow-x:hidden}
h1,h2,h3,h4,p,ul{margin:0}
a{color:var(--violet-d)}
button{font:inherit;cursor:pointer;color:inherit}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.dsp{font-family:Rubik,sans-serif;font-weight:800;letter-spacing:-.025em}
.muted{color:var(--ink3)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.bl{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50% 50% 50% 50% / 58% 58% 42% 42%;background:var(--c);color:var(--t,#1E1B3A);font-family:Rubik,sans-serif;font-weight:800;line-height:1;flex:none;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 6px 8px rgba(30,27,58,.22))}
.bl::after{content:'';position:absolute;top:calc(100% - 3px);left:50%;transform:translateX(-50%);border-left:5px solid transparent;border-right:5px solid transparent;border-bottom:8px solid var(--c)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;border:0;background:var(--ink);color:#fff}
.btn:hover{background:#2C2852}
.btn.w{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line2)}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}

/* nav flotante */
.nav{position:sticky;top:12px;z-index:30;display:flex;justify-content:center;padding:0 12px;pointer-events:none}
.nav .in{pointer-events:auto;display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(30,27,58,.12);max-width:100%;overflow-x:auto}
.nav img{width:40px;height:40px;border-radius:50%;display:block;margin-right:6px}
.nav .brand{display:flex;align-items:center;gap:10px;padding-right:10px;text-decoration:none;color:var(--ink);font-family:Rubik,sans-serif;font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap;flex:none}
.nav .brand img{margin:0}
.nav .sep{width:1px;height:28px;background:var(--line);margin:0 4px;flex:none}
.nav a.n svg{width:18px;height:18px;flex:none}
.nav .me{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 16px;border-radius:999px;text-decoration:none;color:var(--ink);white-space:nowrap;flex:none}
.nav .me:hover{background:var(--sky)}
.nav .me.on{box-shadow:inset 0 0 0 2px var(--ink)}
.nav .me .av{width:36px;height:36px;border-radius:50%;background:var(--sky);border:2px solid #00756D;display:grid;place-items:center;font-family:Rubik,sans-serif;font-weight:800;font-size:15px;color:#00756D}
.nav .me b{display:block;font-size:14px;line-height:1.15}
.nav .me small{display:block;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;color:#00756D;line-height:1.15}
.nav a.n{display:flex;align-items:center;gap:7px;min-height:44px;flex:none;padding:0 14px;border-radius:999px;text-decoration:none;color:var(--ink2);font-weight:600;font-size:14px;white-space:nowrap}
.nav a.n:hover{background:var(--sky)}
.nav a.n.on{background:var(--ink);color:#fff}
.nav .alt{display:flex;align-items:center;gap:8px;padding:0 12px 0 10px;margin-left:6px;border-left:1px solid var(--line);font-size:13px;font-weight:700;white-space:nowrap}

/* training */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:999px;background:#fff;font-size:14px;font-weight:600}
.blocks{position:relative;z-index:3;margin-top:-180px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:20px}
.blk{display:flex;align-items:center;gap:20px;min-height:210px;padding:24px;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 30px rgba(30,27,58,.10);text-decoration:none;color:var(--ink);transition:transform .15s,box-shadow .15s}
.blk:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(30,27,58,.14)}
.blk svg{width:136px;height:119px;flex:none}
.blk div{display:flex;flex-direction:column;gap:8px;min-width:0}
.blk h2{font-size:26px;line-height:1.1}
.blk p{font-size:15px;line-height:1.5;color:var(--ink2)}
.blk .meta{font-family:'IBM Plex Mono',monospace;font-size:13px;color:#5D5880}

/* logros */
.lhead{position:relative;background:linear-gradient(180deg,#E4DAFB 0%,#EDE7FB 45%,#F7F4FE 100%);overflow:hidden}
.lhead .wrap{position:relative;z-index:2;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-top:72px;padding-bottom:210px}
.lhead h2{font-size:72px;line-height:1}
.lhead .cnt{display:flex;align-items:center;gap:16px;font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;color:var(--ink2)}
.lbody{position:relative;z-index:2;margin-top:-120px;padding-bottom:80px}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.filters button{min-height:44px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:600;background:#fff;border:1px solid var(--line2)}
.filters button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.achs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
/* card de logro: ilustración a la izquierda; encendida si está obtenida */
.ach{display:flex;align-items:stretch;width:100%;min-height:196px;padding:0;background:#fff;border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:0 12px 30px rgba(30,27,58,.08);text-align:left;color:var(--ink);transition:transform .15s,box-shadow .15s}
.ach:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(30,27,58,.14)}
.ach .art{position:relative;flex:none;width:262px}
.ach .art svg{position:absolute;left:0;top:0;width:100%;height:100%}
.ach .bd{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:26px 28px 26px 26px;min-width:0}
.ach b{font-family:Rubik,sans-serif;font-weight:800;font-size:26px;line-height:1.1;letter-spacing:-.025em}
.ach .de{font-size:15px;line-height:1.5;color:var(--ink2)}
.ach.got{border-color:#CBB7F4;box-shadow:0 0 0 4px rgba(139,92,246,.10),0 18px 40px rgba(139,92,246,.22)}
.ach.got:hover{box-shadow:0 0 0 4px rgba(139,92,246,.14),0 22px 44px rgba(139,92,246,.28)}
.ach:not(.got) .art svg{filter:grayscale(1);opacity:.45}
.ach:not(.got) b{color:#6B6585}
.ach-pop{display:block;width:100%;max-width:320px;aspect-ratio:16/10;border-radius:18px;overflow:hidden}
.ach-pop svg{display:block;width:100%;height:100%}
.ach-pop:not(.got) svg{filter:grayscale(1);opacity:.5}
@media (max-width:1100px){.ach .art{width:210px}.ach .bd{padding:22px 22px 22px 20px}.ach b{font-size:23px}}
@media (max-width:760px){.achs{grid-template-columns:minmax(0,1fr)}.ach .art{width:42%}}


/* transición entre secciones: lo actual baja y se apaga, lo nuevo entra por partes */
@keyframes vOut{to{opacity:0;transform:translateY(18px)}}
@keyframes vIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes vRise{from{opacity:0;transform:translateY(60px)}to{opacity:1;transform:none}}
#view.leave>*{animation:vOut .24s cubic-bezier(.4,0,1,1) forwards}
#view.enter>*:not(.lhead):not(.lbody){animation:vIn .45s cubic-bezier(.2,.8,.2,1) both}
#view.enter .lhead h2{animation:vIn .55s cubic-bezier(.2,.8,.2,1) both}
#view.enter .lhead .cnt{animation:vIn .55s cubic-bezier(.2,.8,.2,1) .08s both}
#view.enter .lhead .mtn{animation:vRise .8s cubic-bezier(.2,.8,.2,1) both}
#view.enter .filters{animation:vIn .5s cubic-bezier(.2,.8,.2,1) .15s both}
#view.enter .ach{animation:vIn .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.22s + var(--i) * .05s)}
@media (prefers-reduced-motion:reduce){#view.leave>*,#view.enter *{animation:none!important}}
/* training: horizonte detrás del saludo. Todo escala con el ancho (1440px = tamaño base) */
.tr{position:relative;overflow:hidden;min-height:100vh;margin-top:-64px;padding:128px 0 72px;box-sizing:border-box;background:#F7F4FE;display:flex;flex-direction:column;justify-content:center}
.tr .in{position:relative;z-index:2;isolation:isolate;width:min(100% - 48px, max(1120px, 78vw));margin:0 auto;display:flex;flex-direction:column;align-items:center}
.tr h1,.tr .chips{position:relative;z-index:1}
.tr h1{font-size:clamp(40px,4.9vw,110px);line-height:1;text-align:center}
.tr .chips{justify-content:center;margin-top:clamp(18px,1.5vw,32px);gap:clamp(8px,.6vw,12px)}
.tr .chip{min-height:clamp(36px,2.5vw,52px);padding:0 clamp(16px,1.1vw,24px);font-size:clamp(15px,1.05vw,22px)}
/* botón del problema del día bajo el saludo */
.tr .pdb{display:inline-flex;align-items:center;gap:clamp(10px,.8vw,14px);min-height:clamp(52px,3.6vw,64px);padding:0 clamp(18px,1.3vw,24px) 0 6px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 8px 22px rgba(30,27,58,.10);color:var(--ink);text-decoration:none;font-size:clamp(15px,1.05vw,20px);transition:border-color .15s,box-shadow .15s}
.tr .pdb:hover{border-color:#F5A8C2;box-shadow:0 10px 26px rgba(194,24,91,.14);color:var(--ink)}
.tr .pdi{width:clamp(40px,2.9vw,52px);height:clamp(40px,2.9vw,52px);border-radius:50%;background:#FDE7EF;display:flex;align-items:center;justify-content:center;flex:none}
.tr .pdi svg{width:50%;height:50%}
.tr .pdl{font-weight:600;color:#5D5880}
.tr .pdb>svg{width:1em;height:1em;flex:none}
@media (max-width:520px){.tr .pdl{display:none}}
.tr .stage{position:relative;width:100%;margin-top:clamp(56px,6.1vw,140px)}
.tr .hz{position:absolute;z-index:0;left:50%;transform:translateX(-50%);width:100vw;height:max(300px,26.4vw);top:calc(max(40px,5.14vw) - max(300px,26.4vw));overflow:visible}
.tr .blocks{position:relative;z-index:1;margin-top:0;gap:clamp(20px,1.4vw,32px)}
.tr .blk{min-height:clamp(190px,13.2vw,300px);padding:clamp(24px,1.7vw,40px);gap:clamp(20px,1.4vw,32px);border-radius:clamp(18px,1.25vw,26px);box-shadow:0 14px 34px rgba(30,27,58,.12)}
.tr .blk svg{width:clamp(128px,8.9vw,200px);height:auto}
.tr .blk div{gap:clamp(8px,.6vw,14px)}
.tr .blk h2{font-size:clamp(26px,1.8vw,40px)}
.tr .blk p{font-size:clamp(15px,1.05vw,22px)}
.tr .blk .meta{font-size:clamp(13px,.9vw,19px)}
/* training → guía y práctica: la cámara sube, las montañas bajan y se agrandan */
.tr .stk{display:grid;width:100%;justify-items:center}.tr .stk>*{grid-area:1/1;width:100%}
.tr .th,.tr .tl{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
.tr .tl h1{margin:0}
.tr .back{display:inline-flex;align-items:center;gap:6px;margin-top:clamp(18px,1.5vw,32px);min-height:clamp(44px,2.8vw,56px);padding:0 clamp(18px,1.2vw,26px) 0 clamp(12px,.9vw,18px);border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:600;font-size:clamp(14px,1vw,20px);color:var(--ink);text-decoration:none}
.tr .back svg{width:1.25em;height:1.25em}
.tr .lvs .blk div{flex:1;text-align:left;gap:clamp(12px,.9vw,18px)}
.tr .lvs .blk svg{width:clamp(104px,7.2vw,164px)}
.tr .tags{display:flex;flex-wrap:wrap;gap:clamp(6px,.45vw,10px)}
.tr .tag{display:inline-flex;padding:clamp(4px,.3vw,7px) clamp(10px,.7vw,15px);border-radius:999px;background:#F3EFFD;color:var(--ink2);font-size:clamp(13px,.9vw,19px);font-weight:600}
.tr .hz{transform-origin:50% 100%;transition:transform 1s cubic-bezier(.4,0,.2,1)}
.tr.open .hz{transform:translateX(-50%) translateY(max(300px,23.6vw)) scale(1.4)}
.tr .th>*{transition:opacity .35s ease .35s,transform .6s cubic-bezier(.4,0,.2,1) .35s}
.tr .home{transition:opacity .35s ease .4s,transform .6s cubic-bezier(.4,0,.2,1) .4s,visibility 0s 0s}
.tr.open .th{visibility:hidden;transition:visibility 0s .6s}
.tr.open .th>*{opacity:0;transform:translateY(160px);transition-delay:0s}
.tr.open .home{opacity:0;transform:translateY(160px);visibility:hidden;pointer-events:none;transition:opacity .35s ease,transform .6s cubic-bezier(.4,0,.2,1),visibility 0s .6s}
.tr .tl,.tr .lvs{visibility:hidden;pointer-events:none;transition:visibility 0s .5s}
.tr.open .tl,.tr.open .lvs{visibility:visible;pointer-events:auto;transition-delay:0s}
.tr .tl>*,.tr .lvs .blk{opacity:0;transform:translateY(-120px);transition:opacity .3s ease,transform .5s cubic-bezier(.4,0,.2,1)}
.tr.open .tl>*,.tr.open .lvs .blk{opacity:1;transform:none;transition:opacity .4s ease,transform .8s cubic-bezier(.2,.8,.2,1),box-shadow .15s}
.tr.open .tl>*:nth-child(1){transition-delay:.3s}.tr.open .tl>*:nth-child(2){transition-delay:.38s}
.tr.open .lvs .blk:nth-child(1){transition-delay:.36s}.tr.open .lvs .blk:nth-child(2){transition-delay:.44s}.tr.open .lvs .blk:nth-child(3){transition-delay:.52s}
/* problema del día: mismas montañas que Training; lo de la portada baja y el problema cae desde arriba */
/* amanecer: las montañas no se mueven; el cielo se calienta y asoma un poco de sol detrás de la cordillera */
.tr .hz .warm{opacity:0;transition:opacity .8s ease .1s}
.tr.dia .hz .warm{opacity:1;transition:opacity 1.2s ease}
.tr .hz .sun{opacity:0;transform:translateY(66px);transition:opacity .5s ease,transform .7s cubic-bezier(.4,0,.2,1)}
.tr.dia .hz .sun{opacity:1;transform:none;transition:opacity 1s ease .2s,transform 1.4s cubic-bezier(.2,.8,.2,1) .1s}
.tr.dia .th,.tr.dia .home,.tr.arn .th,.tr.arn .home,.tr.rmp .th,.tr.rmp .home{visibility:hidden;pointer-events:none;transition:visibility 0s .4s}
.tr.dia .th>*,.tr.dia .home,.tr.arn .th>*,.tr.arn .home,.tr.rmp .th>*,.tr.rmp .home{opacity:0;transform:translateY(-24px);transition:opacity .3s ease,transform .4s ease;transition-delay:0s}
.tr .dpg{position:absolute;z-index:3;left:0;right:0;top:clamp(110px,8vw,180px);margin:0 auto;width:min(100% - 48px, max(1120px, 78vw));display:flex;flex-direction:column;align-items:flex-start;gap:clamp(20px,1.7vw,32px);opacity:0;visibility:hidden;pointer-events:none;transition:opacity .2s ease,visibility 0s .2s}
.tr.dia .dpg{opacity:1;visibility:visible;pointer-events:auto;transition:none}
.tr .dpg .back{margin-top:0}
.tr .dbox{width:100%;box-sizing:border-box;background:#fff;border:1px solid var(--line);border-radius:clamp(20px,1.5vw,30px);box-shadow:0 14px 34px rgba(30,27,58,.10);text-align:left}
.tr .dhero{display:grid;grid-template-columns:clamp(150px,13vw,260px) minmax(0,1fr) auto;gap:clamp(28px,2.6vw,52px);align-items:center;padding:clamp(32px,2.8vw,56px) clamp(32px,3vw,60px)}
.tr .dhero>svg{width:100%;height:auto}
.tr .dey{font-family:'IBM Plex Mono',monospace;font-size:clamp(13px,.9vw,18px);font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#5D5880}
.tr .dhero h1{margin:clamp(10px,.9vw,18px) 0 0;font-size:clamp(44px,4.2vw,84px);line-height:1.02;text-align:left}
.tr .dst{display:inline-flex;align-items:center;gap:8px;margin-top:clamp(14px,1.2vw,24px);font-size:clamp(15px,1.05vw,21px);font-weight:600;color:#B45309}
.tr .dst i{width:10px;height:10px;border-radius:50%;background:#F7931E}
.tr .dact{display:flex;flex-direction:column;align-items:stretch;gap:12px}
.tr .dcta{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:clamp(56px,3.9vw,76px);padding:0 clamp(24px,1.8vw,36px);border-radius:999px;background:var(--ink);color:#fff;text-decoration:none;font-weight:700;font-size:clamp(17px,1.2vw,23px);white-space:nowrap}
.tr .dcta:hover{background:#2E2A55}
.tr .dcta svg{width:1.1em;height:1.1em}
.tr .dtime{text-align:center;font-size:clamp(14px,1vw,19px);color:var(--ink2)}
.tr .dtime b{font-family:'IBM Plex Mono',monospace;color:var(--ink)}
.tr .dgrid{width:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:clamp(20px,1.7vw,32px)}
.tr .dstreak{padding:clamp(26px,2.1vw,40px);display:flex;flex-direction:column;gap:14px}
.tr .dbig{font-family:Rubik,sans-serif;font-weight:800;font-size:clamp(56px,4.4vw,88px);line-height:1}
.tr .dbig small{font-size:.38em}
.tr .dnums{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:16px;border-top:1px solid #EDE7FB}
.tr .dnums span{display:flex;flex-direction:column;gap:2px;font-size:clamp(13px,.9vw,17px);color:#5D5880}
.tr .dnums b{font-family:'IBM Plex Mono',monospace;font-size:clamp(22px,1.5vw,30px);color:var(--ink)}
.tr .dclub{display:flex;align-items:center;gap:12px;font-size:clamp(14px,.97vw,18px);color:var(--ink2)}
.tr .davs{display:flex;padding-left:8px}
.tr .davs span{width:30px;height:30px;border-radius:50%;border:2px solid #fff;margin-left:-8px;display:flex;align-items:center;justify-content:center;font-family:Rubik,sans-serif;font-weight:800;font-size:12px;color:#fff}
.tr .dheat{padding:clamp(26px,2.1vw,40px);display:flex;flex-direction:column;gap:18px;overflow-x:auto}
.tr .dhd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tr .dhd b{font-size:clamp(17px,1.15vw,22px)}
.tr .dleg{display:flex;align-items:center;gap:8px;font-size:13px;color:#5D5880}
.tr .dleg i{width:14px;height:14px;border-radius:4px;background:#F1EEF8}.tr .dleg i.ok{background:#8B5CF6;margin-left:8px}
.tr .hmw{display:flex;gap:10px}
.tr .hmd{display:grid;grid-template-rows:repeat(7,var(--hc));gap:5px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:#5D5880;line-height:var(--hc)}
.tr .hm{--hc:clamp(16px,1.25vw,24px);display:grid;grid-template-rows:repeat(7,var(--hc));grid-auto-flow:column;grid-auto-columns:var(--hc);gap:5px}
.tr .hmw{--hc:clamp(16px,1.25vw,24px)}
.tr .hc{border-radius:5px;background:#F1EEF8}
.tr .hc.ok{background:#8B5CF6}
.tr .hc.today{background:#FEF1E2;border:2px solid #F7931E;box-sizing:border-box}
.tr .dnote{font-size:clamp(14px,.97vw,18px);color:var(--ink2)}
.tr .dhist{padding:clamp(22px,1.8vw,34px) clamp(26px,2.1vw,40px) 10px}
.tr .drow{display:grid;grid-template-columns:90px minmax(0,1fr) 170px 130px;align-items:center;gap:16px;padding:14px 0;border-top:1px solid #EDE7FB;font-size:clamp(14px,.97vw,18px)}
.tr .drow .mono{color:#5D5880}
.tr .drow b{font-size:clamp(16px,1.15vw,21px)}
.tr .drow.no b{color:#6B6585}
.tr .drow.sum{grid-template-columns:1fr;color:#5D5880}
.tr .dok,.tr .dno{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.tr .dok{color:#15803D}.tr .dno{color:#6B6585}

.spg .sbtn{margin-top:auto}

.spg .sacts{display:flex;justify-content:space-between;gap:12px;margin-top:22px}
.spg .sload{display:flex;align-items:center;gap:14px;padding:6px 0 14px;font-size:17px}
.spg .sspin{width:26px;height:26px;border-radius:50%;border:3px solid #EDE7FB;border-top-color:#8B5CF6;animation:sSpin .8s linear infinite;flex:none}

.spg .sk{display:block;border-radius:8px;background:linear-gradient(90deg,#F1EEF8 25%,#FBFAFE 50%,#F1EEF8 75%);background-size:200% 100%;animation:sShim 1.1s linear infinite}
/* contest */
.spg .ssb{display:grid;border:1px solid #EDE7FB;border-radius:16px;overflow:hidden}
.spg .ssb>*{padding:16px 10px;border-bottom:1px solid #EDE7FB;display:flex;align-items:center;justify-content:center;font-size:16px}
.spg .ssb .rl{justify-content:flex-start;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#5D5880;background:#FAF9FD}

.spg .spl{gap:6px;font-weight:700;color:var(--ink);text-decoration:none}
.spg .spl svg{width:15px;height:15px}
.spg .spl:hover{color:#5B21B6}
.spg .scell{font-family:Rubik,sans-serif;font-weight:800;font-size:22px;min-height:28px}
.spg .c-ac{background:#DCFCE7;color:#15803D}.spg .c-wa{background:#FEE2E2;color:#B91C1C}.spg .c-pe{color:#B9B3CF}
.spg .spop{animation:sPop .6s cubic-bezier(.3,1.6,.5,1)}
.spg .stimer{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:clamp(48px,4.2vw,76px);line-height:1;letter-spacing:.02em}
.spg .svbar{display:block;height:4px;border-radius:99px;background:#EDE7FB;overflow:hidden;margin-top:-10px}
.spg .svbar i{display:block;height:100%;background:#8B5CF6;animation:sDrain 5s linear both}
.spg .sgo{display:flex;align-items:center;justify-content:center;min-height:clamp(380px,30vw,560px)}
.spg .sgo b{font-family:Rubik,sans-serif;font-weight:800;font-size:clamp(160px,13vw,260px);line-height:1;color:#FFF4E0;text-shadow:0 8px 0 #8E2F55,0 18px 40px rgba(60,0,20,.35);animation:sNum .7s cubic-bezier(.2,.8,.2,1) both}
.spg .send{align-items:center;text-align:center;gap:16px}
.spg .sbig{font-family:Rubik,sans-serif;font-size:72px;line-height:1}.spg .sbig small{font-size:30px;color:#5D5880}
.spg .sstart{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.spg .spre{display:inline-flex;align-items:center;gap:12px;min-height:clamp(50px,3.5vw,62px);padding:0 22px 0 8px;border-radius:999px;background:#FEF1E2;color:#B45309;font-weight:700}
.spg .spre-n{width:44px;height:44px;border-radius:50%;background:#F7931E;color:#1E1B3A;display:inline-flex;align-items:center;justify-content:center;font-family:Rubik,sans-serif;font-weight:800;font-size:20px}
.spg a.srr{text-decoration:none}
.spg .sstat{padding:12px 18px;border-radius:14px;background:#F7F4FE}
.spg a.btn{text-decoration:none}.spg a.btn:hover{color:#fff}
.spg .sfresh{animation:sIn .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes sSpin{to{transform:rotate(360deg)}}
@keyframes sShim{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes sIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes sInL{from{opacity:0;transform:translateX(-50px)}to{opacity:1;transform:none}}
@keyframes sInR{from{opacity:0;transform:translateX(50px)}to{opacity:1;transform:none}}
@keyframes sPop{0%{transform:scale(.5)}100%{transform:none}}
@keyframes sDrain{from{width:100%}to{width:0}}
@keyframes sNum{0%{opacity:0;transform:scale(.4)}40%{opacity:1;transform:scale(1)}85%{opacity:1;transform:scale(1.05)}100%{opacity:0;transform:scale(1.4)}}
.spg:not(.still) .sa{animation:sIn .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0s)}
.spg .shd.tin h1{animation:aSlam .5s cubic-bezier(.3,1.5,.5,1) both}
.spg .shd.tin .srow{animation:sIn .5s cubic-bezier(.2,.8,.2,1) .2s both}
.spg:not(.still) .sl{animation:sInL .6s cubic-bezier(.2,.8,.2,1) .1s both}
.spg:not(.still) .sr{animation:sInR .6s cubic-bezier(.2,.8,.2,1) .2s both}
@media (max-width:900px){.spg .sfmts,.spg .sgrid,.spg .sgrid.run{grid-template-columns:minmax(0,1fr)}.spg .ssb{overflow-x:auto}}
@media (max-width:520px){.tr .spg{width:calc(100% - 32px)}.spg .slvv{width:170px}.spg .sacts{flex-direction:column}}

/* página de subtema: recursos, esenciales, Codeforces y extras */

/* nivel abierto: foco en la card y temas en 2 columnas */
.tr .stk{position:relative}

.tr.lv,.tr.pin,.tr.dia,.tr.arn,.tr.rmp{justify-content:flex-start}

.tr.lv .stage{margin-top:clamp(40px,4.2vw,96px)}

<script>
var G = window.GPC, V = document.getElementById('view');
var PEAK = 6768; // Huascarán
function bl(t, c, ink, st) { return '<span class="bl" style="--c:' + c + ';--t:' + (ink || '#1E1B3A') + ';' + (st || '') + '">' + t + '</span>'; }
function overall(ladder) { var w = [7, 8, 8, 8], a = 0; ladder.forEach(function (p, i) { a += p * w[i]; }); return a / 31; }
function alt(ladder) { return Math.round(overall(ladder) / 100 * PEAK); }
function fmt(n) { return n.toLocaleString('es-PE'); }
function rt(r) { return '<b class="mono" style="color:' + G.rankOf(r).color + '">' + r + '</b>'; }
// Usuario provisional del prototipo
(function () {
  var me = G.me, d = 1701 - me.rating;
  me.handle = 'Jean_Pool'; me.name = 'Jean Pool'; me.rating = 1701; me.rank = G.rankOf(1701);
  me.maxRating = Math.max(me.maxRating + d, 1701);
  me.history = me.history.map(function (v) { return v + d; });
  G.achievements.forEach(function (a) { if (a.id === 'expert-dia') { a.mine = true; a.date = '14 nov 2026'; } });
  document.getElementById('mename').textContent = me.handle;
  document.querySelector('.nav .me').setAttribute('href', '#/miembro/' + encodeURIComponent(me.handle) + '/cf');
  var mr = document.getElementById('merating'); mr.textContent = me.rank.name + ' ' + me.rating; mr.style.color = me.rank.color;
})();

function mountain(h, extra) {
  return '<svg class="mtn" viewBox="0 0 1440 260" preserveAspectRatio="none" aria-hidden="true">' +
    '<path d="M0 250 L0 190 L160 120 L260 160 L420 60 L520 110 L610 40 L700 20 L760 70 L880 30 L1000 120 L1120 80 L1260 150 L1440 100 L1440 250Z" fill="#D3C6F5"/>' +
    '<path d="M610 40 L700 20 L760 70 L735 64 L700 44 L660 62 Z M420 60 L470 84 L445 82Z" fill="#fff" opacity=".8"/>' +
    '<path d="M0 250 L0 220 L200 170 L380 210 L560 150 L740 200 L920 160 L1100 210 L1300 170 L1440 200 L1440 250Z" fill="#B8A6EE"/>' +
    '<path d="M0 260 L0 240 L240 220 L520 245 L800 225 L1100 248 L1440 232 L1440 260Z" fill="#F7F4FE"/>' + (extra || '') + '</svg>';
}

/* ---------- RUTA ---------- */
function viewRuta() {
  var me = G.me, a = alt(me.ladder);
  var h = '<header class="hero"><div class="wrap"><span class="eyebrow">El ladder del GPC</span><h1 class="dsp">Del campamento base<br>a la cumbre del ICPC.</h1>' +
    '<p style="font-size:18px;line-height:1.6;color:var(--ink2);max-width:600px">31 temas, cuatro tramos y una sola ruta. Cada problema que resuelves en Codeforces te sube un poco más. La cima tiene la altura del Huascarán: ' + fmt(PEAK) + ' m.</p>' +
    '<div class="altimeter">' + bl('T', '#03A89E', '#fff') + '<div><div class="mono muted" style="font-size:11px">TU ALTITUD</div><div class="dsp" style="font-size:30px">' + fmt(a) + ' m</div></div><div style="width:1px;align-self:stretch;background:var(--line)"></div><div><div class="mono muted" style="font-size:11px">SIGUIENTE CAMPAMENTO</div><b>Avanzado · ' + fmt(Math.round(15 / 31 * PEAK)) + ' m</b></div></div>' +
    '<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:6px"><a class="btn" href="#/ruta" id="gohere">Ir a donde me quedé ↓</a><a class="btn w" href="#/album">Ver mi álbum</a></div>' +
    '<div style="height:120px"></div></div>' + mountain() + '</header>';
  h += '<section class="s" style="padding-top:20px"><div class="wrap"><div class="route" id="route"></div></div></section>';
  return h;
}
function drawRoute() {
  var R = document.getElementById('route'); if (!R) return;
  var W = R.clientWidth, narrow = W < 640, cx = W / 2, y = 80, items = [], STEP = 128, CAMP = 150;
  var amp = narrow ? 0 : Math.min(230, W / 2 - 160);
  var offs = [0, .55, 1, .55, 0, -.55, -1, -.55];
  var order = G.levels.slice().reverse(), current = null;
  G.levels.some(function (l) { return G.topicsOf(l.id).some(function (t) { if (t.solved < t.total) { current = t.id; return true; } }); });
  var k = 0;
  order.forEach(function (l) {
    items.push({ type: 'camp', l: l, y: y }); y += CAMP;
    G.topicsOf(l.id).slice().reverse().forEach(function (t) {
      var x = narrow ? 56 + (k % 2) * 24 : cx + offs[k % 8] * amp;
      items.push({ type: 'node', t: t, l: l, x: x, y: y }); y += STEP; k++;
    });
    y += 10;
  });
  R.style.height = (y + 20) + 'px';
  var nodes = items.filter(function (i) { return i.type === 'node'; });
  var d = '';
  nodes.forEach(function (n, i) { if (!i) d = 'M' + n.x + ' ' + n.y; else { var p = nodes[i - 1], my = (p.y + n.y) / 2; d += ' C' + p.x + ' ' + my + ' ' + n.x + ' ' + my + ' ' + n.x + ' ' + n.y; } });

function subOrigin(tr, href) {

  if (!ln) return;

  tps.style.transformOrigin = x + 'px ' + y + 'px';
  sbp.style.transformOrigin = (x + tps.offsetLeft - sbp.offsetLeft) + 'px ' + (y + tps.offsetTop - sbp.offsetTop) + 'px';
}
